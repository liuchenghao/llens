<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 满幅铺底 + 两个交叉大镜头 + 大量不规则小镜头 -->
  <defs>
    <radialGradient id="bgA" cx="42%" cy="34%" r="95%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="48%" stop-color="#5b4bff"/>
      <stop offset="100%" stop-color="#1a1050"/>
    </radialGradient>
    <radialGradient id="lens1" cx="40%" cy="34%" r="82%">
      <stop offset="0%" stop-color="#eaf1ff"/>
      <stop offset="55%" stop-color="#8ea2ff"/>
      <stop offset="100%" stop-color="#3a2f8f"/>
    </radialGradient>
    <radialGradient id="lens2" cx="42%" cy="36%" r="82%">
      <stop offset="0%" stop-color="#c7d4ff"/>
      <stop offset="55%" stop-color="#6d78f0"/>
      <stop offset="100%" stop-color="#2a2070"/>
    </radialGradient>
    <radialGradient id="mini" cx="40%" cy="34%" r="82%">
      <stop offset="0%" stop-color="#d0ddff"/>
      <stop offset="60%" stop-color="#7c8af5"/>
      <stop offset="100%" stop-color="#2a1f6e"/>
    </radialGradient>
  </defs>

  <!-- 满幅深色底（铺满 1024 正方形，四角无白边） -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bgA)"/>

  <!-- 大量小镜头：不规则散布（有疏有密） -->
  <g opacity="0.9">
    <!-- 左上密集区 -->
    <g><circle cx="222" cy="252" r="22" fill="url(#mini)"/><circle cx="222" cy="252" r="11" fill="#15103d"/><circle cx="216" cy="246" r="3" fill="#fff" opacity=".55"/></g>
    <g><circle cx="278" cy="222" r="18" fill="url(#mini)"/><circle cx="278" cy="222" r="9" fill="#15103d"/><circle cx="273" cy="217" r="2.5" fill="#fff" opacity=".55"/></g>
    <g><circle cx="196" cy="318" r="16" fill="url(#mini)"/><circle cx="196" cy="318" r="8" fill="#15103d"/></g>
    <g><circle cx="252" cy="336" r="24" fill="url(#mini)"/><circle cx="252" cy="336" r="12" fill="#15103d"/><circle cx="245" cy="328" r="3" fill="#fff" opacity=".5"/></g>
    <g><circle cx="336" cy="288" r="15" fill="url(#mini)"/><circle cx="336" cy="288" r="7" fill="#15103d"/></g>
    <g><circle cx="360" cy="352" r="13" fill="url(#mini)"/><circle cx="360" cy="352" r="6" fill="#15103d"/></g>
    <g><circle cx="290" cy="392" r="17" fill="url(#mini)"/><circle cx="290" cy="392" r="8" fill="#15103d"/></g>

    <!-- 右上稍疏区 -->
    <g><circle cx="688" cy="222" r="22" fill="url(#mini)"/><circle cx="688" cy="222" r="11" fill="#15103d"/><circle cx="682" cy="216" r="3" fill="#fff" opacity=".55"/></g>
    <g><circle cx="768" cy="262" r="16" fill="url(#mini)"/><circle cx="768" cy="262" r="8" fill="#15103d"/></g>
    <g><circle cx="712" cy="300" r="18" fill="url(#mini)"/><circle cx="712" cy="300" r="9" fill="#15103d"/></g>
    <g><circle cx="792" cy="352" r="20" fill="url(#mini)"/><circle cx="792" cy="352" r="10" fill="#15103d"/><circle cx="786" cy="346" r="3" fill="#fff" opacity=".5"/></g>
    <g><circle cx="824" cy="448" r="14" fill="url(#mini)"/><circle cx="824" cy="448" r="7" fill="#15103d"/></g>
    <g><circle cx="850" cy="530" r="12" fill="url(#mini)"/><circle cx="850" cy="530" r="6" fill="#15103d"/></g>
    <g><circle cx="760" cy="410" r="15" fill="url(#mini)"/><circle cx="760" cy="410" r="7" fill="#15103d"/></g>

    <!-- 右侧纵向疏密交错 -->
    <g><circle cx="818" cy="556" r="20" fill="url(#mini)"/><circle cx="818" cy="556" r="10" fill="#15103d"/><circle cx="812" cy="550" r="3" fill="#fff" opacity=".5"/></g>
    <g><circle cx="788" cy="648" r="15" fill="url(#mini)"/><circle cx="788" cy="648" r="7" fill="#15103d"/></g>
    <g><circle cx="812" cy="736" r="22" fill="url(#mini)"/><circle cx="812" cy="736" r="11" fill="#15103d"/><circle cx="806" cy="730" r="3" fill="#fff" opacity=".55"/></g>
    <g><circle cx="770" cy="810" r="14" fill="url(#mini)"/><circle cx="770" cy="810" r="7" fill="#15103d"/></g>
    <g><circle cx="840" cy="800" r="16" fill="url(#mini)"/><circle cx="840" cy="800" r="8" fill="#15103d"/></g>

    <!-- 左下密集区 -->
    <g><circle cx="218" cy="556" r="18" fill="url(#mini)"/><circle cx="218" cy="556" r="9" fill="#15103d"/></g>
    <g><circle cx="196" cy="632" r="24" fill="url(#mini)"/><circle cx="196" cy="632" r="12" fill="#15103d"/><circle cx="189" cy="624" r="3" fill="#fff" opacity=".5"/></g>
    <g><circle cx="252" cy="684" r="15" fill="url(#mini)"/><circle cx="252" cy="684" r="7" fill="#15103d"/></g>
    <g><circle cx="214" cy="748" r="20" fill="url(#mini)"/><circle cx="214" cy="748" r="10" fill="#15103d"/><circle cx="208" cy="742" r="3" fill="#fff" opacity=".5"/></g>
    <g><circle cx="300" cy="790" r="17" fill="url(#mini)"/><circle cx="300" cy="790" r="8" fill="#15103d"/></g>
    <g><circle cx="372" cy="742" r="14" fill="url(#mini)"/><circle cx="372" cy="742" r="7" fill="#15103d"/></g>
    <g><circle cx="340" cy="640" r="13" fill="url(#mini)"/><circle cx="340" cy="640" r="6" fill="#15103d"/></g>
    <g><circle cx="270" cy="760" r="16" fill="url(#mini)"/><circle cx="270" cy="760" r="8" fill="#15103d"/></g>

