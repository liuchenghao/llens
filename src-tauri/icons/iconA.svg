    <g><circle cx="472" cy="806" r="22" fill="url(#mini)"/><circle cx="472" cy="806" r="11" fill="#15103d"/><circle cx="466" cy="800" r="3" fill="#fff" opacity=".55"/></g>
    <g><circle cx="560" cy="772" r="15" fill="url(#mini)"/><circle cx="560" cy="772" r="7" fill="#15103d"/></g>
    <g><circle cx="636" cy="800" r="19" fill="url(#mini)"/><circle cx="636" cy="800" r="9" fill="#15103d"/><circle cx="630" cy="794" r="3" fill="#fff" opacity=".5"/></g>
    <g><circle cx="716" cy="782" r="14" fill="url(#mini)"/><circle cx="716" cy="782" r="7" fill="#15103d"/></g>
    <g><circle cx="400" cy="770" r="13" fill="url(#mini)"/><circle cx="400" cy="770" r="6" fill="#15103d"/></g>
    <g><circle cx="530" cy="830" r="12" fill="url(#mini)"/><circle cx="530" cy="830" r="6" fill="#15103d"/></g>

    <!-- 中上疏区 -->
    <g><circle cx="472" cy="196" r="16" fill="url(#mini)"/><circle cx="472" cy="196" r="8" fill="#15103d"/></g>
    <g><circle cx="556" cy="216" r="13" fill="url(#mini)"/><circle cx="556" cy="216" r="6" fill="#15103d"/></g>
    <g><circle cx="608" cy="332" r="14" fill="url(#mini)"/><circle cx="608" cy="332" r="7" fill="#15103d"/></g>
    <g><circle cx="420" cy="260" r="12" fill="url(#mini)"/><circle cx="420" cy="260" r="6" fill="#15103d"/></g>
