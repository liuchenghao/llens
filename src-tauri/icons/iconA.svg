    <g><circle cx="560" cy="540" r="14" fill="url(#mini)"/><circle cx="560" cy="540" r="7" fill="#15103d"/></g>
    <g><circle cx="510" cy="580" r="13" fill="url(#mini)"/><circle cx="510" cy="580" r="6" fill="#15103d"/></g>
    <g><circle cx="580" cy="620" r="15" fill="url(#mini)"/><circle cx="580" cy="620" r="7" fill="#15103d"/></g>
    <g><circle cx="640" cy="440" r="12" fill="url(#mini)"/><circle cx="640" cy="440" r="6" fill="#15103d"/></g>
    <g><circle cx="480" cy="640" r="14" fill="url(#mini)"/><circle cx="480" cy="640" r="7" fill="#15103d"/></g>

    <!-- 四角补点 -->
    <g><circle cx="170" cy="420" r="12" fill="url(#mini)"/><circle cx="170" cy="420" r="6" fill="#15103d"/></g>
    <g><circle cx="160" cy="720" r="13" fill="url(#mini)"/><circle cx="160" cy="720" r="6" fill="#15103d"/></g>
    <g><circle cx="480" cy="170" r="14" fill="url(#mini)"/><circle cx="480" cy="170" r="7" fill="#15103d"/></g>
    <g><circle cx="740" cy="190" r="13" fill="url(#mini)"/><circle cx="740" cy="190" r="6" fill="#15103d"/></g>
    <g><circle cx="860" cy="620" r="12" fill="url(#mini)"/><circle cx="860" cy="620" r="6" fill="#15103d"/></g>
    <g><circle cx="840" cy="320" r="14" fill="url(#mini)"/><circle cx="840" cy="320" r="7" fill="#15103d"/></g>
  </g>

  <!-- 两个大镜头交叉咬合（主体） -->
  <g>
    <circle cx="628" cy="560" r="212" fill="#fff" opacity="0.14"/>
    <circle cx="628" cy="560" r="180" fill="url(#lens2)"/>
    <circle cx="628" cy="560" r="120" fill="#171048" opacity="0.82"/>
    <circle cx="628" cy="560" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="5"/>
    <ellipse cx="572" cy="500" rx="44" ry="32" fill="#ffffff" opacity="0.4"/>
    <circle cx="628" cy="560" r="20" fill="#9aa8ff"/>
  </g>

  <g>
    <circle cx="410" cy="440" r="236" fill="#fff" opacity="0.16"/>
    <circle cx="410" cy="440" r="200" fill="url(#lens1)"/>
    <circle cx="410" cy="440" r="134" fill="#1c1550" opacity="0.88"/>
    <circle cx="410" cy="440" r="134" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6"/>
    <ellipse cx="344" cy="372" rx="50" ry="36" fill="#ffffff" opacity="0.55"/>
    <circle cx="410" cy="440" r="24" fill="#cfd8ff"/>
  </g>
</svg>
